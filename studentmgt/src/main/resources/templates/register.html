<!DOCTYPE html>
<!-- xmlns:th tells the browser this page uses Thymeleaf template attributes -->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Registration</title>
    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
        }
        .form-box {
            background: white;
            padding: 30px;
            max-width: 400px;
            border-radius: 8px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #333;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #28a745;
            color: white;
            padding: 10px;
            width: 100%;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        .links {
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="form-box">
    <h2>Register a New Student</h2>

    <form th:action="@{/student/register}" th:object="${student}" method="post">


        <div class="input-group">
            <label for="firstName">First Name:</label>

            <input type="text" id="firstName" th:field="*{firstName}"  required />
        </div>


        <div class="input-group">
            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" th:field="*{lastName}" required />
        </div>


        <div class="input-group">
            <label for="email">Email Address:</label>

            <input type="email" id="email" th:field="*{email}"  required />
        </div>


        <div class="input-group">
            <label for="age">Age:</label>
            <input type="number" id="age" th:field="*{age}" min="1" required />
        </div>


        <div>
            <button type="submit">Register Student</button>
        </div>

    </form>


    <div class="links">
        <a th:href="@{/student/all}">View All Registered Students</a>
    </div>
</div>

</body>
</html>
