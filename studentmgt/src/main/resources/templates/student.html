<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Registered Students</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #333;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .no-students {
            text-align: center;
            color: #777;
            margin: 20px 0;
            font-style: italic;
        }
        .link-nav {
            margin-top: 20px;
            text-align: center;
        }
        .link-nav a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
        .link-nav a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Registered Students List</h2>

    <div th:if="${#lists.isEmpty(students)}" class="no-students">
        <p>No students are registered yet.</p>
    </div>

    <table th:unless="${#lists.isEmpty(students)}">
        <thead>
        <tr>
            <th>ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>Age</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="student : ${students}">
            <td th:text="${student.id}">1</td>
            <td th:text="${student.firstName}">John</td>
            <td th:text="${student.lastName}">Doe</td>
            <td th:text="${student.email}">john@example.com</td>
            <td th:text="${student.age}">20</td>
        </tr>
        </tbody>
    </table>

    <div class="link-nav">
        <a th:href="@{/student/register}">Register a New Student</a>
    </div>
</div>

</body>
</html>
